[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autoexpert-mvp"
version = "0.8.1"
description = "Automatic evidence-grounded vehicle research and VIN precheck MVP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "email-validator>=2.2,<3",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  "pydantic-settings>=2.7,<3",
  "pyjwt>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy>=2.0.36,<3",
  "uvicorn[standard]>=0.34,<1",
  "pypdf>=5,<7",
  "reportlab>=4,<5",
  "beautifulsoup4>=4.12,<5",
  "Pillow>=11,<13",
]

[project.scripts]
autoexpert-preview = "app.run_preview:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
