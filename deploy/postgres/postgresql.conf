# Auto Expert — PostgreSQL 16 on a 4 GB server (Hetzner CX23) shared with the backend, the proxy and
# the system. Conservative: the database gets about a quarter of the memory.
listen_addresses = '*'            # inside the Docker network only; the port is never published
max_connections = 40
shared_buffers = 768MB
effective_cache_size = 2GB
work_mem = 8MB
maintenance_work_mem = 128MB
wal_buffers = 16MB
min_wal_size = 256MB
max_wal_size = 1GB
checkpoint_completion_target = 0.9
random_page_cost = 1.1            # SSD
effective_io_concurrency = 200
default_statistics_target = 100
max_worker_processes = 2
max_parallel_workers = 2
max_parallel_workers_per_gather = 1
jit = off
# logs
log_min_duration_statement = 1000 # statements slower than 1 s
log_line_prefix = '%m [%p] %u@%d '
timezone = 'UTC'
